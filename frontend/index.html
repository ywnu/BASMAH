<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASMAH | Verification Workspace</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.sidebar{background:#10233d;color:white;padding:26px 18px}.brand{font-size:25px;font-weight:800;letter-spacing:2px;margin:0 10px 35px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#8fcfd0;font-weight:500}.nav{width:100%;background:transparent;border:0;color:#b8c7d8;text-align:left;padding:13px 15px;border-radius:10px;margin:3px 0}.nav[aria-current="page"],.nav:hover{background:#21405c;color:#fff}.main{padding:32px;max-width:1350px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.eyebrow{color:#078b88;font-size:12px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}h1{font-size:30px;margin:7px 0 8px}p.muted,.muted{color:#64748b}.pill{display:inline-block;border-radius:99px;padding:6px 10px;background:#e2f4f0;color:#047568;font-size:12px;font-weight:700}.btn{border:0;border-radius:10px;padding:11px 16px;background:#087e83;color:#fff;font-weight:700}.btn.secondary{background:#e8eef4;color:#1b3550}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:25px 0}.card{background:white;border:1px solid #e3e9f0;border-radius:15px;padding:22px;box-shadow:0 5px 24px #1c355008}.statnum{font-size:30px;font-weight:800;margin-top:10px}.panel{margin-top:18px}.toolbar{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.search{padding:11px 13px;border:1px solid #d5dfe8;border-radius:9px;min-width:250px;max-width:100%;background:white}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px;border-bottom:1px solid #edf1f5;font-size:14px}th{color:#62758a;font-size:12px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border:0}.empty{padding:35px;text-align:center;color:#64748b}.hidden{display:none!important}.formgrid{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:600;font-size:13px}input,select,textarea{border:1px solid #cad6e1;border-radius:9px;padding:10px;background:#fff;color:#17243a}textarea{min-height:90px;resize:vertical}.modal{position:fixed;inset:0;background:#0b1930a8;display:grid;place-items:center;padding:16px}.dialog{background:white;border-radius:16px;padding:25px;width:min(500px,100%);max-height:90vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialoghead button{background:transparent;border:0;font-size:26px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.notice{background:#fff8e5;border:1px solid #f2dea6;border-radius:10px;padding:12px 16px;color:#775813;font-size:13px;margin:20px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}:focus-visible{outline:3px solid #00a7a1;outline-offset:3px}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{padding:14px}.brand{margin:0 0 12px}.navlist{display:flex;overflow:auto}.nav{white-space:nowrap;width:auto}.main{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){.stats{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<a href="#content" class="sr-only" onfocus="this.classList.remove('sr-only')" onblur="this.classList.add('sr-only')">Skip to main content</a>
<div class="shell"><aside class="sidebar"><div class="brand">BASMAH<small>VERIFICATION PLATFORM</small></div><nav class="navlist" aria-label="Main navigation"><button class="nav" data-page="dashboard" aria-current="page">Dashboard</button><button class="nav" data-page="projects">Projects</button><button class="nav" data-page="claims">Claims</button><button class="nav" data-page="sources">Sources</button><button class="nav" data-page="evidence">Evidence</button><button class="nav" data-page="reviews">Reviews</button><button class="nav" data-page="versions">History</button></nav></aside>
<main class="main" id="content"><header class="top"><div><div class="eyebrow">Research &amp; Verification</div><h1 id="heading">Overview</h1><p class="muted" id="subtitle">Track projects, claims, and supporting evidence.</p></div><span class="pill">Prototype • Mock Data</span></header><div class="notice">Demo only: changes are stored in this browser session and are not connected to MySQL. No authentication is implemented.</div><div id="stats" class="stats"></div><section class="card panel"><div class="toolbar"><input class="search" id="search" type="search" aria-label="Search records" placeholder="Search records..."><button id="add" class="btn">+ Add record</button></div><div class="tablewrap" id="tablearea"></div></section><p id="announcer" role="status" aria-live="polite" class="sr-only"></p></main></div>
<div id="modal" class="modal hidden" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><div class="dialoghead"><h2 id="dialogtitle">Add record</h2><button id="close" aria-label="Close dialog">×</button></div><form id="recordform"><div id="fields" class="formgrid"></div><div class="actions"><button type="button" id="cancel" class="btn secondary">Cancel</button><button type="submit" class="btn">Save record</button></div></form></div></div>
<script>
'use strict';
const seed={projects:[{ProjectID:1,ProjectName:'Health Claims Review',Description:'Verify public health statements',OwnerID:1},{ProjectID:2,ProjectName:'Technology Fact Check',Description:'Evaluate technology-related claims',OwnerID:2}],claims:[{ClaimID:1,ProjectID:1,CreatedBy:1,ClaimText:'Example health statement for review',Status:'Pending'},{ClaimID:2,ProjectID:2,CreatedBy:2,ClaimText:'Example technology statement',Status:'Verified'}],sources:[{SourceID:1,Title:'Research article',URL:'https://example.org/research',SourceType:'Study'},{SourceID:2,Title:'Reference publication',URL:'https://example.org/reference',SourceType:'Website'}],evidence:[{EvidenceID:1,ClaimID:1,SourceID:1,EvidenceText:'Sample evidence description',EvidenceType:'Study'}],reviews:[{ReviewID:1,ClaimID:2,ReviewerID:2,Decision:'Approve',ReviewDate:'2026-11-21'}],versions:[{VersionID:1,ClaimID:1,ChangedBy:1,PreviousText:'Previous sample claim text',ChangedAt:'2026-11-20'}]};
const fields={projects:['ProjectName','Description','OwnerID'],claims:['ProjectID','CreatedBy','ClaimText','Status'],sources:['Title','URL','SourceType'],evidence:['ClaimID','SourceID','EvidenceText','EvidenceType'],reviews:['ClaimID','ReviewerID','Decision','ReviewDate'],versions:['ClaimID','ChangedBy','PreviousText','ChangedAt']};
const keys={projects:'ProjectID',claims:'ClaimID',sources:'SourceID',evidence:'EvidenceID',reviews:'ReviewID',versions:'VersionID'};
const subtitles={dashboard:'Track projects, claims, and supporting evidence.',projects:'Manage research projects.',claims:'Review and organize verification claims.',sources:'Maintain supporting source references.',evidence:'Connect evidence to claims and sources.',reviews:'View claim review decisions.',versions:'Review claim change history.'};
let data=structuredClone(seed),page='dashboard',previousFocus=null;
const $=s=>document.querySelector(s);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(rows){if(!rows.length)return '<div class="empty">No records found.</div>';const cols=Object.keys(rows[0]);return '<table><thead><tr>'+cols.map(c=>'<th scope="col">'+escapeHTML(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+escapeHTML(r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function render(){const target=page==='dashboard'?'claims':page;$('#heading').textContent=page==='dashboard'?'Overview':page[0].toUpperCase()+page.slice(1);$('#subtitle').textContent=subtitles[page];document.querySelectorAll('.nav').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#stats').classList.toggle('hidden',page!=='dashboard');$('#stats').innerHTML=[['Projects',data.projects.length],['Claims',data.claims.length],['Evidence',data.evidence.length],['Reviews',data.reviews.length]].map(([a,b])=>'<div class="card"><div class="muted">'+a+'</div><div class="statnum">'+b+'</div></div>').join('');$('#add').textContent='+ Add '+target.slice(0,-1);$('#add').dataset.target=target;const q=$('#search').value.toLowerCase().trim();$('#tablearea').innerHTML=table(data[target].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))))}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;$('#search').value='';render()}));$('#search').addEventListener('input',render);
function close(){ $('#modal').classList.add('hidden');previousFocus?.focus()}
$('#close').onclick=close;$('#cancel').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))close();if(e.key==='Tab'&&!$('#modal').classList.contains('hidden')){const a=[...$('#modal').querySelectorAll('button,input,textarea,select')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
$('#add').onclick=()=>{const t=$('#add').dataset.target;previousFocus=document.activeElement;$('#dialogtitle').textContent='Add '+t.slice(0,-1);$('#recordform').dataset.target=t;$('#fields').innerHTML=fields[t].map(f=>'<label>'+escapeHTML(f)+(f==='Description'||f==='EvidenceText'||f==='ClaimText'||f==='PreviousText'?'<textarea name="'+f+'" required></textarea>':'<input name="'+f+'" '+(/ID$/.test(f)?'type="number" min="1"':/Date|ChangedAt/.test(f)?'type="date"':f==='URL'?'type="url"':'type="text"')+' required>')+'</label>').join('');$('#modal').classList.remove('hidden');$('#fields').querySelector('input,textarea').focus()};
$('#recordform').onsubmit=e=>{e.preventDefault();const t=e.currentTarget.dataset.target,fd=new FormData(e.currentTarget),row={};row[keys[t]]=Math.max(0,...data[t].map(r=>Number(r[keys[t]])||0))+1;for(const [k,v] of fd.entries())row[k]=/ID$/.test(k)?Number(v):v;data[t].push(row);close();render();$('#announcer').textContent='Demo record added to '+t+'. Not saved to database.'};
render();
</script></body></html>
